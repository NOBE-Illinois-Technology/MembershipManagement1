services:
  web:
    build:
      context: .
      target: development
    container_name: membership-management-dev
    command: sleep infinity
    ports:
      - "3000:3000"
    volumes:
      # Mount project source code for live hot-reloading
      - .:/app
      # Anonymous volumes to isolate container Linux dependencies and build cache from host OS
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    restart: unless-stopped
