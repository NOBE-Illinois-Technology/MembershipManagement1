services:
  web:
    build:
      context: .
      target: development
    container_name: membership-management-dev
    command: sleep infinity
    ports:
      - "3000:3000"
    volumes:
      # Mount project source code for live hot-reloading
      - .:/app
      # Anonymous volumes to isolate container Linux dependencies and build cache from host OS
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    # Deliberately no `restart:` policy. This is a dev container driven by "Reopen in
    # Container" and `npm run dev` — closing it should stop the site. An auto-restart policy
    # also resurrects the container on Docker Desktop boot *without* Compose running, which
    # can bring it back attached to no network at all: every Supabase call then fails with a
    # confusing downstream error. Start it with `docker compose up -d`.
